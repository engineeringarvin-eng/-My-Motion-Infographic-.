<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Circular Progress</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        overflow: hidden;
    }
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
            radial-gradient(circle at 30% 30%, rgba(168, 85, 247, 0.12), transparent 45%),
            radial-gradient(circle at 70% 70%, rgba(34, 211, 238, 0.12), transparent 45%);
        pointer-events: none;
    }
    .chart {
        position: relative;
        width: min(80vw, 380px);
        aspect-ratio: 1;
        opacity: 0;
        transform: scale(0.7);
        animation: fadeScale 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fadeScale {
        to { opacity: 1; transform: scale(1); }
    }
    svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
    }
    .track {
        fill: none;
        stroke: rgba(255, 255, 255, 0.1);
        stroke-width: 12;
    }
    .progress {
        fill: none;
        stroke: url(#gradient);
        stroke-width: 12;
        stroke-linecap: round;
        stroke-dasharray: 1; /* طول مسیر */
        stroke-dashoffset: 1; /* مقدار اولیه */
        transition: stroke-dashoffset 2.5s cubic-bezier(0.22, 1, 0.36, 1);
        filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6));
    }
    .text-container {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
    }
    .number {
        font-size: clamp(2.5rem, 8vw, 4rem);
        font-weight: 700;
        background: linear-gradient(to right, #a855f7, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .label {
        font-size: 0.9rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 4px;
    }
</style>
</head>
<body>

<div class="chart">
    <svg viewBox="0 0 100 100">
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#a855f7" />
                <stop offset="100%" stop-color="#22d3ee" />
            </linearGradient>
        </defs>
        <circle class="track" cx="50" cy="50" r="44" />
        <circle class="progress" id="progress-circle" cx="50" cy="50" r="44" />
    </svg>
    <div class="text-container">
        <div class="number" id="number-display">0%</div>
        <div class="label">Complete</div>
    </div>
</div>

<script>
    const circle = document.getElementById('progress-circle');
    const numberDisplay = document.getElementById('number-display');
    
    // پارامترهای دایره
    const radius = circle.r.baseVal.value;
    const circumference = 2 * Math.PI * radius;
    const targetPercent = 85; // درصد نهایی

    // تنظیمات اولیه
    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;

    // شروع انیمیشن بعد از لود شدن صفحه
    window.addEventListener('load', () => {
        // 1. انیمیشن حلقه
        const offset = circumference - (targetPercent / 100) * circumference;
        circle.style.strokeDashoffset = offset;

        // 2. انیمیشن شمارنده عدد
        let currentPercent = 0;
        const duration = 2500; // مدت زمان انیمیشن (میلی‌ثانیه)
        const stepTime = 10; // هر 10 میلی‌ثانیه یک بار آپدیت شود
        const steps = duration / stepTime;
        const increment = targetPercent / steps;

        const counter = setInterval(() => {
            currentPercent += increment;
            if (currentPercent >= targetPercent) {
                currentPercent = targetPercent;
                clearInterval(counter);
            }
            numberDisplay.textContent = Math.round(currentPercent) + '%';
        }, stepTime);
    });
</script>

</body>
</html>
